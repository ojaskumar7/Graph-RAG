[project]
name = "graphrag-lite"
version = "0.1.0"
description = "Lightweight GraphRAG MVP (stdlib-first, no PyTorch/CUDA)"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
